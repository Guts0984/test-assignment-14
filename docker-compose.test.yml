# Test profile: nginx on the host network so it sees real client addresses (127.0.0.N) - Docker's port proxy would
# hide them. Test-only switches (clock, stub chaos) and loose throttles are enabled. Use together with the main file.
services:
  api-1:
    ports: ["127.0.0.1:3001:3001"]
    environment: &test-env
      TEST_CLOCK_ENABLED: "true"
      API_PUBLIC_URL: http://127.0.0.1:8080
      CORS_ORIGINS: http://127.0.0.1:8080
      REGISTER_THROTTLE_IP_MAX: "100000"
      LOGIN_THROTTLE_IP_MAX: "100000"
      LOGIN_THROTTLE_ACCOUNT_IP_MAX: "100000"
      # nginx runs on the host network in this profile, so containers cannot resolve it by name: talk to the stub directly.
      PAYMENT_WEBHOOK_URL: http://127.0.0.1:3001/api/webhooks/payments
      PAYMENT_PROVIDER_URL: http://api-1:3001/stub
      STUB_DISPATCH_INTERVAL_MS: "200"
      STUB_CHAOS_MAX_DELAY_MS: "5000"
      TRUSTED_PROXY_CIDRS: "127.0.0.1/32,172.16.0.0/12"
      # Queue thresholds: the e2e queue scenario runs the stack with limit 1; everything else uses the real rules.
      QUEUE_ACTIVATE_AT: ${E2E_QUEUE_ACTIVATE_AT:-500}
      QUEUE_MAX_SELECTING: ${E2E_QUEUE_MAX_SELECTING:-200}
  api-2:
    ports: ["127.0.0.1:3002:3001"]
    environment:
      <<: *test-env
      API_INSTANCE_ID: api-2
  worker:
    environment:
      WORKER_INSTANCE_ID: worker-1
      PAYMENT_PROVIDER_URL: http://api-1:3001/stub
      QUEUE_ACTIVATE_AT: ${E2E_QUEUE_ACTIVATE_AT:-500}
      QUEUE_MAX_SELECTING: ${E2E_QUEUE_MAX_SELECTING:-200}
  web:
    ports: ["127.0.0.1:3000:3000"]
  nginx:
    network_mode: host
    ports: !reset []
    volumes: !override ["./infra/nginx/nginx.test.conf:/etc/nginx/nginx.conf:ro"]

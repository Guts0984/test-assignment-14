name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: dev-postgres-password-change-me
          POSTGRES_DB: tickets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickets" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://tickets:dev-postgres-password-change-me@localhost:5432/tickets
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare env from the example
        run: cp .env.example .env
      - run: pnpm typecheck
      - run: pnpm lint
      - name: No secrets in the repo
        run: pnpm check:secrets
      - run: pnpm build
      - name: Generated API client matches the schema
        run: pnpm check:api-client
      - name: Unit tests
        run: pnpm test
      - name: Integration and adversarial tests (real postgres, redis and a booted server)
        run: pnpm test:int

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare env from the example
        run: cp .env.example .env
      - name: Start the full stack (nginx, two api copies, worker, web, postgres, redis, mail stub)
        run: bash scripts/stack.sh up
      - name: Adversarial checks against the deployed stack
        run: set -a && . ./.env && set +a && STACK_P95_BUDGET_MS=3000 pnpm --filter @ticketing/api test:stack
      - run: pnpm --filter @ticketing/web exec playwright install --with-deps chromium
      - name: Browser journeys
        run: pnpm e2e
      - name: Stack logs on failure
        if: failure()
        run: bash scripts/stack.sh logs

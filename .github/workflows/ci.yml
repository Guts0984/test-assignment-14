name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: dev-postgres-password-change-me
          POSTGRES_DB: tickets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickets" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://tickets:dev-postgres-password-change-me@localhost:5432/tickets
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare env from the example
        run: cp .env.example .env
      - run: pnpm typecheck
      - run: pnpm lint
      - name: No secrets in the repo
        run: pnpm check:secrets
      - name: Generated API client matches the schema
        run: pnpm check:api-client
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (real postgres and redis)
        run: pnpm test:int
      - run: pnpm build

# Two api copies behind one entry point. The client address is whatever nginx sees; it is written over
# X-Forwarded-For, so a client cannot choose the address the api uses for throttling.
worker_processes auto;
events { worker_connections 4096; }

http {
  upstream api { least_conn; server api-1:3001 max_fails=0; server api-2:3001 max_fails=0; keepalive 64; }
  upstream web { server web:3000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  client_max_body_size 3m;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  server_tokens off;

  server {
    listen 80;

    location ~ ^/(api|stub|docs)(/|$) {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
    }
  }
}

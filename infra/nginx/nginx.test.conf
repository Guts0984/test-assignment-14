# Two api copies behind one entry point. The client address is whatever nginx sees; it is written over
# X-Forwarded-For, so a client cannot choose the address the api uses for throttling.
worker_processes auto;
events { worker_connections 4096; }

http {
  upstream api { least_conn; server 127.0.0.1:3001 max_fails=0; server 127.0.0.1:3002 max_fails=0; keepalive 64; }
  upstream api_1 { server 127.0.0.1:3001; }
  upstream api_2 { server 127.0.0.1:3002; }
  upstream web { server 127.0.0.1:3000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  client_max_body_size 3m;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  server_tokens off;

  server {
    listen 8080;

    location ~ ^/(api|stub|docs)(/|$) {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
    }
  }

  # Test only: same routing, but every api request goes to one fixed copy.
  server {
    listen 8081;
    location ~ ^/(api|stub|docs)(/|$) { proxy_pass http://api_1; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Connection ""; }
    location /socket.io/ { proxy_pass http://api_1; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 3600s; }
    location / { proxy_pass http://web; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ""; }
  }

  # Test only: same routing, but every api request goes to one fixed copy.
  server {
    listen 8082;
    location ~ ^/(api|stub|docs)(/|$) { proxy_pass http://api_2; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Connection ""; }
    location /socket.io/ { proxy_pass http://api_2; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 3600s; }
    location / { proxy_pass http://web; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ""; }
  }
}

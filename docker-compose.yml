name: ticketing

x-api: &api
  build: { context: ., target: api }
  env_file: .env
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 3s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300", "-c", "synchronous_commit=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes: ["./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: applies migrations, then the seed (idempotent, advisory-locked). Nothing else to do by hand.
  migrate:
    build: { context: ., target: migrate }
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  mailstub:
    build: { context: ., target: mailstub }
    env_file: .env
    ports: ["127.0.0.1:${MAILSTUB_PUBLISH_PORT:-8025}:8025"]

  api-1:
    <<: *api
    environment: { API_INSTANCE_ID: api-1 }
  api-2:
    <<: *api
    environment: { API_INSTANCE_ID: api-2 }

  worker:
    build: { context: ., target: worker }
    env_file: .env
    environment: { WORKER_INSTANCE_ID: worker-1 }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      api-1: { condition: service_healthy }
      mailstub: { condition: service_started }

  web:
    build: { context: ., target: web }
    env_file: .env
    depends_on: { api-1: { condition: service_healthy } }

  nginx:
    image: nginx:1.27-alpine
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["${NGINX_PORT:-8080}:80"]
    depends_on: [api-1, api-2, web]

volumes:
  pgdata:
